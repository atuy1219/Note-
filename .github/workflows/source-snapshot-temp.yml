name: Source Snapshot Temp

on:
  push:
    branches:
      - agent/note-app

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: note-current-source
          path: |
            app
            build.gradle.kts
            settings.gradle.kts
            gradle.properties
            README.md
            docs
            .github/workflows/android.yml
          include-hidden-files: true
