name: Apply Goodnotes foundation

on:
  push:
    branches:
      - agent/goodnotes-foundation
    paths:
      - .github/workflows/apply-goodnotes-foundation.yml

permissions:
  contents: write

jobs:
  apply-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/goodnotes-foundation
      - name: Verify patch chunks
        run: |
          sha256sum .github/patch/goodnotes.part-*
          exit 1
