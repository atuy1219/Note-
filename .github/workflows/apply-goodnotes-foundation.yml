name: Apply Goodnotes foundation

on:
  push:
    branches:
      - agent/goodnotes-foundation
    paths:
      - .github/workflows/apply-goodnotes-foundation.yml

permissions:
  contents: write

jobs:
  apply-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/goodnotes-foundation
          fetch-depth: 0

      - name: Apply implementation patch
        shell: bash
        env:
          PATCH_GZ_BASE64: ''
        run: |
          printf '%s' "$PATCH_GZ_BASE64" | base64 -d | gzip -d > /tmp/goodnotes-foundation.patch
          git apply --index /tmp/goodnotes-foundation.patch
          rm .github/workflows/apply-goodnotes-foundation.yml
          git add -A
          git diff --cached --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build and test
        shell: bash
        run: gradle :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest --stacktrace

      - name: Commit and push
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Build Goodnotes-style note app foundation'
          git push origin HEAD:agent/goodnotes-foundation
