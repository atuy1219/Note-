name: Fix toolbar blocks and eraser icon

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fix-toolbar-blocks-eraser.yml'

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.head_ref == 'agent/fix-toolbar-block-order-eraser-icon'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply toolbar fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/java/com/atuy/note/ui/EnhancedNoteApp.kt')
          text = path.read_text()

          old_import = 'import androidx.compose.material.icons.filled.AutoAwesome\n'
          new_import = old_import + 'import androidx.compose.material.icons.filled.AutoFixNormal\n'
          if 'import androidx.compose.material.icons.filled.AutoFixNormal\n' not in text:
              if old_import not in text:
                  raise SystemExit('AutoAwesome icon import anchor not found')
              text = text.replace(old_import, new_import, 1)

          old_eraser = 'Icons.Default.DeleteOutline,\n        "消しゴム",'
          new_eraser = 'Icons.Default.AutoFixNormal,\n        "消しゴム",'
          if old_eraser not in text:
              raise SystemExit('Eraser CommandSpec anchor not found')
          text = text.replace(old_eraser, new_eraser, 1)

          swaps = [
              ('CommandColumn(detailBlock', 'CommandColumn(pageBlock'),
              ('CommandRow(detailBlock', 'CommandRow(pageBlock'),
          ]
          for detail_call, page_call in swaps:
              if detail_call not in text or page_call not in text:
                  raise SystemExit(f'Toolbar block anchor not found: {detail_call} / {page_call}')
              sentinel = f'__SWAP_{detail_call.replace("(", "_").replace(" ", "_")}__'
              text = text.replace(detail_call, sentinel)
              text = text.replace(page_call, detail_call)
              text = text.replace(sentinel, page_call)

          path.write_text(text)

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 37
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: '9.5.0'

      - name: Build and test
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if gradle :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest --stacktrace; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle attempt $attempt failed; retrying dependency resolution..."
              sleep $((attempt * 20))
            fi
          done
          exit 1

      - name: Persist fix
        run: |
          rm -f .github/workflows/fix-toolbar-blocks-eraser.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/atuy/note/ui/EnhancedNoteApp.kt .github/workflows/fix-toolbar-blocks-eraser.yml
          git commit -m 'Swap toolbar edge blocks and use eraser icon'
          git push origin HEAD:${{ github.head_ref }}
