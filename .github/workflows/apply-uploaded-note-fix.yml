name: Apply uploaded note fix

on:
  pull_request:
    branches:
      - agent/note-app
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: apply-uploaded-note-fix
  cancel-in-progress: false

jobs:
  apply-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/note-app
          fetch-depth: 0

      - name: Decode and apply the uploaded patch exactly
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/note-app-fixes.patch.gz.b64 <<'PATCH_B64'

PATCH_B64
          base64 -d /tmp/note-app-fixes.patch.gz.b64 | gzip -d > /tmp/note-app-fixes.patch
          echo '4c57fcecac798968e0a4ee3b19acfb669d7a32a5d7c765faf8b0121b9c9bf749  /tmp/note-app-fixes.patch' | sha256sum -c -
          git apply --check /tmp/note-app-fixes.patch
          git apply /tmp/note-app-fixes.patch
          sha256sum -c <<'EXPECTED'
27d6f69756a4a0c219fae95d886e70467af5f6212e779681c1f58a421b88a9ba  app/src/main/java/com/atuy/note/ink/InkPageView.kt
536abecb2f47c6d9af14979d0f64d9fd1ff99b23ae0ddc2e4376d2d32bea8802  app/src/main/java/com/atuy/note/ink/InkViewport.kt
a6a96fbc28f879fd8d153256d8187dcf77dc2083336104acdbcac359d503216b  app/src/test/java/com/atuy/note/ink/InkViewportTest.kt
EXPECTED
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build and test the exact uploaded patch
        shell: bash
        run: gradle :app:assembleDebug :app:testDebugUnitTest --stacktrace

      - name: Commit and push only the uploaded patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-uploaded-note-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/atuy/note/ink/InkPageView.kt \
            app/src/main/java/com/atuy/note/ink/InkViewport.kt \
            app/src/main/java/com/atuy/note/ui/NoteApp.kt \
            app/src/test/java/com/atuy/note/ink/InkViewportTest.kt \
            docs/ARCHITECTURE.md \
            .github/workflows/apply-uploaded-note-fix.yml
          git diff --cached --check
          git commit -m 'Fix PDF ink viewport synchronization'
          git push origin HEAD:agent/note-app
