name: Apply toolbar lasso and library management

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'agent/toolbar-lasso-library-management'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/toolbar-lasso-library-management
          fetch-depth: 0

      - name: Apply implementation
        run: python .github/apply_library_management.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 37
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: '9.5.0'

      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest --stacktrace

      - name: Persist implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/atuy/note/data/Models.kt \
            app/src/main/java/com/atuy/note/data/NoteRepository.kt \
            app/src/main/java/com/atuy/note/MainViewModel.kt \
            app/src/main/java/com/atuy/note/ink/InkPageView.kt \
            app/src/main/java/com/atuy/note/ui/EnhancedNoteApp.kt
          git rm .github/apply_library_management.py
          git rm .github/workflows/apply-toolbar-lasso-library.yml
          git diff --cached --check
          git commit -m 'Implement toolbar layout lasso conversion and library management'
          git push origin HEAD:agent/toolbar-lasso-library-management
