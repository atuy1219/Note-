name: Apply recycled bitmap fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-recycled-bitmap.yml

permissions:
  contents: write

jobs:
  apply-build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v7

      - name: Apply bitmap ownership fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          note_app = "app/src/main/java/com/atuy/note/ui/NoteApp.kt"
          main_vm = "app/src/main/java/com/atuy/note/MainViewModel.kt"
          ink_view = "app/src/main/java/com/atuy/note/ink/InkPageView.kt"

          replace_once(note_app, "import androidx.compose.runtime.DisposableEffect\n", "")
          replace_once(
              note_app,
              '''                        DisposableEffect(preview) {
                            onDispose { preview?.let { if (!it.isRecycled) it.recycle() } }
                        }
''',
              '''                        // Compose and the hardware renderer may retain this Bitmap in a
                        // recorded display list after the composable leaves composition. Explicitly
                        // recycling it here can race the next draw; allow GC to reclaim it instead.
''',
          )

          replace_once(
              main_vm,
              '''            session.imageBitmaps.values.forEach { bitmap -> if (!bitmap.isRecycled) bitmap.recycle() }
            openTabs.removeAt(index)
''',
              '''            // Do not recycle UI-visible bitmaps here. The outgoing AndroidView or a
            // hardware display list can still reference them for one or more frames.
            openTabs.removeAt(index)
''',
          )
          replace_once(
              main_vm,
              '''                session.imageBitmaps.values.forEach { bitmap -> if (!bitmap.isRecycled) bitmap.recycle() }
                val index = openTabs.indexOfFirst { it.id == session.id }
''',
              '''                // Bitmap lifetime follows the session references; explicit recycle can
                // race the final frame of the editor while it leaves composition.
                val index = openTabs.indexOfFirst { it.id == session.id }
''',
          )

          replace_once(
              ink_view,
              '''            backgroundBitmap?.let { bitmap ->
                canvas.drawBitmap(bitmap, null, RectF(0f, 0f, current.width, current.height), imagePaint)
            }
''',
              '''            backgroundBitmap?.takeUnless { it.isRecycled }?.let { bitmap ->
                canvas.drawBitmap(bitmap, null, RectF(0f, 0f, current.width, current.height), imagePaint)
            }
''',
          )
          replace_once(
              ink_view,
              '''                val bitmap = imageBitmaps[image.entryName] ?: return@forEach
''',
              '''                val bitmap = imageBitmaps[image.entryName]?.takeUnless { it.isRecycled } ?: return@forEach
''',
          )
          PY

          git diff --check
          if grep -R "\.recycle()" -n app/src/main/java/com/atuy/note/ui app/src/main/java/com/atuy/note/MainViewModel.kt; then
            echo "Unexpected explicit Bitmap.recycle remains in UI/session ownership code."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 37
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: '9.5.0'

      - name: Build and test
        run: gradle :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest --stacktrace

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/atuy/note/MainViewModel.kt \
                  app/src/main/java/com/atuy/note/ui/NoteApp.kt \
                  app/src/main/java/com/atuy/note/ink/InkPageView.kt
          git commit -m "Fix recycled bitmap drawing crash"
          git push origin HEAD:main
