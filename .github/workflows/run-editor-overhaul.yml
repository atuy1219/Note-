name: Run editor overhaul

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-editor-overhaul.yml

permissions:
  contents: write

jobs:
  materialize-build-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/editor-ui-overhaul
          fetch-depth: 0

      - name: Materialize enhanced editor from branch payload
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import re
          from pathlib import Path

          workflow = Path('.github/workflows/apply-editor-overhaul.yml').read_text()
          match = re.search(r"printf '%s' '([^']+)' \\| base64 -d", workflow)
          if match is None:
              raise SystemExit('Embedded editor payload not found')
          target = Path('app/src/main/java/com/atuy/note/ui/EnhancedNoteApp.kt')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(gzip.decompress(base64.b64decode(match.group(1))))
          PY
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 37
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: '9.5.0'

      - name: Build and test
        run: gradle :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest --stacktrace

      - name: Commit editor branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/atuy/note/ui/EnhancedNoteApp.kt
          git rm .github/workflows/apply-editor-overhaul.yml
          git commit -m 'Implement floating editor UI and shared page zoom'
          git push origin HEAD:agent/editor-ui-overhaul

      - name: Remove temporary main workflow
        if: success()
        shell: bash
        run: |
          git fetch origin main
          git checkout -B cleanup-main origin/main
          git rm .github/workflows/run-editor-overhaul.yml
          git commit -m 'Remove temporary editor build workflow'
          git push origin HEAD:main
