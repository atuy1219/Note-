name: Run editor overhaul

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write

jobs:
  materialize-build-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/editor-ui-overhaul
          fetch-depth: 0

      - name: Materialize enhanced editor from branch payload
        shell: bash
        run: |
          echo 'Payload is being replaced with verified chunks.'
          exit 1
