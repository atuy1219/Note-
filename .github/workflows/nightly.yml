name: Nightly APKs

# Manual nightly trigger: 2026-08-03T22:39:00+09:00
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Build debug and release
        id: version
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION_CODE="$(date -u +%s)"
          VERSION_NAME="0.7.0-nightly+${SHORT_SHA}"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          gradle :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest \
            -PnightlyVersionCode="$VERSION_CODE" \
            -PnightlyVersionName="$VERSION_NAME" \
            --stacktrace

      - name: Sign and collect APKs
        shell: bash
        run: |
          mkdir -p dist
          keytool -genkeypair -v \
            -keystore nightly.keystore \
            -storepass android \
            -alias nightly \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Note Nightly, O=atuy1219, C=JP"

          while IFS= read -r apk; do
            base="$(basename "$apk")"
            output="dist/${base/-unsigned/}"
            apksigner sign \
              --ks nightly.keystore \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$output" \
              "$apk"
            apksigner verify "$output"
          done < <(find app/build/outputs/apk/release -name '*-unsigned.apk' -type f | sort)

          while IFS= read -r apk; do
            cp "$apk" "dist/$(basename "$apk")"
          done < <(find app/build/outputs/apk/debug -name '*.apk' -type f | sort)

          test -n "$(find dist -name '*.apk' -print -quit)"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload nightly artifacts
        uses: actions/upload-artifact@v7
        with:
          name: note-nightly-${{ steps.version.outputs.short_sha }}
          path: dist/*
          if-no-files-found: error

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: nightly-${{ steps.version.outputs.short_sha }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "Note $VERSION_NAME" \
              --notes "Automated debug and R8-minified release APKs for commit $GITHUB_SHA." \
              --prerelease
          fi
