name: Apply editor overhaul

on:
  push:
    branches:
      - agent/editor-ui-overhaul
    paths:
      - .github/workflows/apply-editor-overhaul.yml

permissions:
  contents: write

jobs:
  apply-build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/editor-ui-overhaul

      - name: Materialize enhanced editor
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/atuy/note/ui
          printf '%s' '' | base64 -d | gzip -d > app/src/main/java/com/atuy/note/ui/EnhancedNoteApp.kt
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 37
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: '9.5.0'

      - name: Build and test
        run: gradle :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest --stacktrace

      - name: Commit generated editor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/atuy/note/ui/EnhancedNoteApp.kt
          git rm .github/workflows/apply-editor-overhaul.yml
          git commit -m 'Implement floating editor UI and shared page zoom'
          git push origin HEAD:agent/editor-ui-overhaul
