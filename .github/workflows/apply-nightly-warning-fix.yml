name: Apply nightly workflow and warning fixes

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'agent/fix-nightly-validation-warnings'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/fix-nightly-validation-warnings
          fetch-depth: 0

      - name: Apply fixes
        run: python .github/fix_nightly_and_warnings.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 37
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: '9.5.0'

      - name: Build, test, and reject Kotlin warnings
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest --stacktrace 2>&1 | tee build.log
          if grep -F 'w: file://' build.log; then
            echo 'Kotlin compiler warnings remain.' >&2
            exit 1
          fi

      - name: Persist fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/nightly.yml \
            app/src/main/java/com/atuy/note/ui/EnhancedNoteApp.kt \
            app/src/main/java/com/atuy/note/ui/NoteApp.kt
          git rm .github/fix_nightly_and_warnings.py
          git rm .github/workflows/apply-nightly-warning-fix.yml
          git diff --check
          git commit -m 'Fix nightly validation and Compose warnings'
          git push origin HEAD:agent/fix-nightly-validation-warnings
