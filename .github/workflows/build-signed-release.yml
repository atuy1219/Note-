name: Build signed release

on:
  pull_request:
    branches:
      - agent/note-app
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: signed-release-v0.6.0
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.head.ref == 'agent/note-release-v0.6.0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: v0.6.0
      RELEASE_NAME: Note 0.6.0
      SOURCE_SHA: 9e440dda6ed315e81f7cea8c25993af2733d81f1
      KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
      KEY_PASSWORD_VALUE: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS_VALUE: ${{ secrets.ALIAS }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
        run: |
          set -euo pipefail
          for value in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD_VALUE KEY_ALIAS_VALUE; do
            if [ -z "${!value:-}" ]; then
              echo "::error::Required GitHub Secret is missing: $value"
              exit 1
            fi
          done

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"

      - name: Run unit tests and build release APK
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Sign and verify APK
        run: |
          set -euo pipefail
          unsigned_apk='app/build/outputs/apk/release/app-release-unsigned.apk'
          signed_apk='Note-v0.6.0.apk'
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          test -f "$unsigned_apk"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$KEY_ALIAS_VALUE" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD_VALUE \
            --out "$signed_apk" \
            "$unsigned_apk"

          "$apksigner" verify --verbose --print-certs "$signed_apk"
          sha256sum "$signed_apk" > "$signed_apk.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists; refusing to overwrite it."
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            'Note-v0.6.0.apk#Signed APK' \
            'Note-v0.6.0.apk.sha256#SHA-256 checksum' \
            --target "$SOURCE_SHA" \
            --title "$RELEASE_NAME" \
            --generate-notes

      - name: Delete temporary trigger branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method DELETE \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/git/refs/heads/agent/note-release-v0.6.0"
