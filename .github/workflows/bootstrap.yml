name: Bootstrap project

on:
  push:
    branches:
      - agent/note-app

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    if: github.event.head_commit.message != 'Implement Android note app'
    steps:
      - uses: actions/checkout@v4
      - name: Materialize project
        shell: bash
        run: |
          cat .bootstrap/part* | base64 --decode | tar -xzf -
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement Android note app'
          git push origin HEAD:agent/note-app
