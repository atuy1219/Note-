name: Apply Material 3 shell

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  materialize-build-cleanup:
    if: github.head_ref == 'agent/material3-goodnotes-shell'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/material3-goodnotes-shell
          fetch-depth: 0

      - name: Materialize verified UI sources
        shell: bash
        run: |
          cat .github/material3-payload/part* > /tmp/material3.b64
          echo '5ff30c61487bae9d04c999bea4718950599179d74206d1b003467b0dcc4a522e  /tmp/material3.b64' | sha256sum -c -
          base64 -d /tmp/material3.b64 > /tmp/material3.tar.gz
          tar -xzf /tmp/material3.tar.gz

      - name: Add read-only input routing
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/java/com/atuy/note/ink/InkPageView.kt')
          text = path.read_text()

          replacements = [
              (
                  '    private var circleToLassoEnabledProvider: () -> Boolean = { false }\n'
                  '    private var onNavigationPan: (Float, Float) -> Unit = { _, _ -> }',
                  '    private var circleToLassoEnabledProvider: () -> Boolean = { false }\n'
                  '    private var readOnlyProvider: () -> Boolean = { false }\n'
                  '    private var onNavigationPan: (Float, Float) -> Unit = { _, _ -> }',
              ),
              (
                  '        circleToLassoEnabledProvider: () -> Boolean,\n'
                  '        onNavigationPan: (Float, Float) -> Unit,',
                  '        circleToLassoEnabledProvider: () -> Boolean,\n'
                  '        readOnlyProvider: () -> Boolean = { false },\n'
                  '        onNavigationPan: (Float, Float) -> Unit,',
              ),
              (
                  '        this.circleToLassoEnabledProvider = circleToLassoEnabledProvider\n'
                  '        this.onNavigationPan = onNavigationPan',
                  '        this.circleToLassoEnabledProvider = circleToLassoEnabledProvider\n'
                  '        this.readOnlyProvider = readOnlyProvider\n'
                  '        this.onNavigationPan = onNavigationPan',
              ),
              (
                  '        val actionIsStylus = actionToolType == MotionEvent.TOOL_TYPE_STYLUS ||\n'
                  '            actionToolType == MotionEvent.TOOL_TYPE_ERASER\n\n'
                  '        if (!actionIsStylus) {',
                  '        val actionIsStylus = actionToolType == MotionEvent.TOOL_TYPE_STYLUS ||\n'
                  '            actionToolType == MotionEvent.TOOL_TYPE_ERASER\n\n'
                  '        if (readOnlyProvider() && actionIsStylus) {\n'
                  '            if (event.actionMasked == MotionEvent.ACTION_DOWN ||\n'
                  '                event.actionMasked == MotionEvent.ACTION_POINTER_DOWN\n'
                  '            ) {\n'
                  '                onActivated()\n'
                  '            }\n'
                  '            return true\n'
                  '        }\n\n'
                  '        if (!actionIsStylus) {',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected InkPageView block not found: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Persist implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/atuy/note/ui/EnhancedNoteApp.kt
          git add app/src/main/java/com/atuy/note/ui/UiPreferences.kt
          git add app/src/main/java/com/atuy/note/ink/InkPageView.kt
          git rm -r .github/material3-payload
          git diff --check
          git commit -m 'Rebuild app shell and editor controls with Material 3'
          git push origin HEAD:agent/material3-goodnotes-shell

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 37
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: '9.5.0'

      - name: Build and test
        run: gradle :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest --stacktrace

      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          git fetch origin main
          git checkout -B cleanup-main origin/main
          git rm .github/workflows/apply-material3-shell.yml
          git commit -m 'Remove temporary Material 3 build workflow'
          git push origin HEAD:main
