name: Apply Material 3 shell

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  build-fix-cleanup:
    if: github.head_ref == 'agent/material3-goodnotes-shell'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/material3-goodnotes-shell
          fetch-depth: 0

      - name: Apply compiler fix
        shell: bash
        run: |
          sed -i '/import androidx\.compose\.foundation\.layout\.weight/d' app/src/main/java/com/atuy/note/ui/EnhancedNoteApp.kt
          git diff --check

      - name: Persist compiler fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/atuy/note/ui/EnhancedNoteApp.kt
          if ! git diff --cached --quiet; then
            git commit -m 'Fix Compose weight import'
            git push origin HEAD:agent/material3-goodnotes-shell
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 37
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: '9.5.0'

      - name: Build and test
        run: gradle :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest --stacktrace

      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          git fetch origin main
          git checkout -B cleanup-main origin/main
          git rm .github/workflows/apply-material3-shell.yml
          git commit -m 'Remove temporary Material 3 build workflow'
          git push origin HEAD:main
