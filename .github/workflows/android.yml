name: Android CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Apply initial compiler fixes
        id: source_fixes
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/note-app'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/atuy/note/MainViewModel.kt')
          text = path.read_text()
          text = text.replace(
              'withContext(Dispatchers.Main) { statusMessage = message }',
              'viewModelScope.launch { statusMessage = message }',
          )
          path.write_text(text)

          path = Path('app/src/main/java/com/atuy/note/data/NoteRepository.kt')
          text = path.read_text()
          old = '''    fun readDocument(file: File): NoteDocument? = runCatching {
              ZipInputStream(BufferedInputStream(FileInputStream(file))).use { zip ->
                  while (true) {
                      val entry = zip.nextEntry ?: return@use null
                      if (entry.name == "manifest.json") return@use json.decodeFromString<NoteDocument>(zip.readBytes().decodeToString())
                      zip.closeEntry()
                  }
              }
          }.getOrNull()
          '''
          new = '''    fun readDocument(file: File): NoteDocument? = runCatching {
              var document: NoteDocument? = null
              ZipInputStream(BufferedInputStream(FileInputStream(file))).use { zip ->
                  while (document == null) {
                      val entry = zip.nextEntry ?: break
                      if (entry.name == "manifest.json") {
                          document = json.decodeFromString<NoteDocument>(zip.readBytes().decodeToString())
                      }
                      zip.closeEntry()
                  }
              }
              document
          }.getOrNull()
          '''
          if old in text:
              path.write_text(text.replace(old, new))

          path = Path('app/src/main/java/com/atuy/note/ui/NoteApp.kt')
          path.write_text(path.read_text().replace('import androidx.compose.foundation.layout.weight\n', ''))
          PY

          if git diff --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/src/main/java
            git commit -m 'Fix initial Kotlin compilation errors'
            git push origin HEAD:agent/note-app
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.source_fixes.outputs.changed != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.source_fixes.outputs.changed != 'true'
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        if: steps.source_fixes.outputs.changed != 'true'
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        if: steps.source_fixes.outputs.changed != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build and test
        if: steps.source_fixes.outputs.changed != 'true'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if gradle :app:assembleDebug :app:testDebugUnitTest --stacktrace; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle attempt $attempt failed; retrying dependency resolution..."
              sleep $((attempt * 20))
            fi
          done
          exit 1

      - name: Upload debug APK
        if: steps.source_fixes.outputs.changed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: note-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
