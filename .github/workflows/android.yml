name: Apply Ink Storage and Lasso

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reconstruct source changes
        run: |
          cat scripts/.payload/models.* | base64 -d > app/src/main/java/com/atuy/note/data/Models.kt
          cat scripts/.payload_text/ink.* > app/src/main/java/com/atuy/note/ink/InkPageView.kt
          cat scripts/.payload_text/vm.* > app/src/main/java/com/atuy/note/MainViewModel.kt
          cat scripts/.payload_text/apply.* > /tmp/apply_storage_lasso.py
          sed -i 's/^             Spacer(Modifier.width(6.dp))/            Spacer(Modifier.width(6.dp))/' /tmp/apply_storage_lasso.py
          python /tmp/apply_storage_lasso.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build and test
        run: gradle :app:assembleDebug :app:testDebugUnitTest --stacktrace > build.log 2>&1

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ink-storage-lasso-build-log
          path: build.log
          if-no-files-found: warn

      - name: Commit verified source
        run: |
          rm -rf scripts/.payload scripts/.payload_text
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app docs scripts
          git diff --cached --quiet || git commit -m 'Use Ink Storage and add lasso selection'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: note-ink-storage-lasso-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
