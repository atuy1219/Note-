name: Android CI

on:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Apply pending source fix
        if: github.ref == 'refs/heads/agent/note-app'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/atuy/note/data/NoteRepository.kt')
          text = path.read_text()
          start = text.index('    fun readDocument(file: File): NoteDocument?')
          end = text.index('\n\n    fun replaceFromRemoteBlocking', start)
          replacement = '''    fun readDocument(file: File): NoteDocument? = runCatching {
              var document: NoteDocument? = null
              ZipInputStream(BufferedInputStream(FileInputStream(file))).use { zip ->
                  while (document == null) {
                      val entry = zip.nextEntry ?: break
                      if (entry.name == "manifest.json") {
                          document = json.decodeFromString<NoteDocument>(zip.readBytes().decodeToString())
                      }
                      zip.closeEntry()
                  }
              }
              document
          }.getOrNull()
          '''
          path.write_text(text[:start] + replacement + text[end:])
          PY

          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/src/main/java/com/atuy/note/data/NoteRepository.kt
            git commit -m 'Fix note archive manifest decoding'
            git push origin HEAD:agent/note-app
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build and test
        id: build
        shell: bash
        run: |
          set +e
          : > build.log
          status=1
          for attempt in 1 2 3; do
            echo "===== Gradle attempt $attempt =====" | tee -a build.log
            gradle :app:assembleDebug :app:testDebugUnitTest --stacktrace 2>&1 | tee -a build.log
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Retrying after failure..." | tee -a build.log
              sleep $((attempt * 20))
            fi
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record verification result
        if: always() && github.ref == 'refs/heads/agent/note-app'
        shell: bash
        run: |
          mkdir -p .ci
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if [ "${{ steps.build.outputs.status }}" = "0" ]; then
              echo "result=success"
            else
              echo "result=failure"
            fi
            echo
            echo "--- relevant output ---"
            grep -E '(^e: |FAILURE:|What went wrong:|BUILD SUCCESSFUL|BUILD FAILED|Execution failed for task|Could not resolve|UnknownHostException)' build.log | tail -n 200 || true
            echo
            echo "--- log tail ---"
            tail -n 120 build.log || true
          } > .ci/build-result.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci/build-result.txt
          git commit -m 'Record Android build verification' || true
          git push origin HEAD:agent/note-app

      - name: Fail if build failed
        if: steps.build.outputs.status != '0'
        run: exit 1

      - name: Upload debug APK
        if: steps.build.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: note-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
