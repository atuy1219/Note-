name: Apply Zoom and Input Fix

on:
  push:
    branches:
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-apply:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/note-app
          fetch-depth: 0

      - name: Apply zoom, tabs, and coordinate fixes
        shell: bash
        run: |
          base64 -d scripts/.zoom_input_fix.b64 | gzip -d > /tmp/apply_zoom_input_fix.py
          sed -i 's#root = Path(__file__).resolve().parents\[1\]#root = Path.cwd()#' /tmp/apply_zoom_input_fix.py
          python /tmp/apply_zoom_input_fix.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build and test
        shell: bash
        run: gradle :app:assembleDebug :app:testDebugUnitTest --stacktrace > build.log 2>&1

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zoom-input-build-log
          path: build.log
          if-no-files-found: warn

      - name: Commit verified source
        shell: bash
        run: |
          rm -f scripts/.zoom_input_fix.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app scripts
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'Add pinch zoom and fix ink coordinates'
            git push origin HEAD:agent/note-app
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: note-0.5.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
