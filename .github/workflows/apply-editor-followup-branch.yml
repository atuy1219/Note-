name: Apply editor follow-up on branch

on:
  push:
    branches:
      - agent/fix-editor-interactions

permissions:
  contents: write

jobs:
  patch-build-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/fix-editor-interactions
          fetch-depth: 0

      - name: Apply requested fixes
        run: python .github/apply_editor_followup.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 37
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: '9.5.0'

      - name: Build and test
        run: gradle :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest --stacktrace

      - name: Persist implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/atuy/note/ui/EnhancedNoteApp.kt
          git add app/src/main/java/com/atuy/note/MainActivity.kt
          git add app/src/main/java/com/atuy/note/ink/InkPageView.kt
          git rm .github/apply_editor_followup.py .github/editor-followup-trigger
          git rm .github/workflows/apply-editor-followup-branch.yml
          git diff --check
          git commit -m 'Fix editor insets, lasso gestures, spacing, and photo picker'
          git push origin HEAD:agent/fix-editor-interactions
