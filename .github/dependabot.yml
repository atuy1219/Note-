version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: cron
      cronjob: "0 3 * * *"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 50
    rebase-strategy: auto
    allow:
      - dependency-type: all
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "30 3 * * *"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 50
    rebase-strategy: auto
    allow:
      - dependency-type: all
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major
