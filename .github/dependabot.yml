version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    groups:
      android-dependencies:
        patterns:
          - "androidx.*"
          - "com.android.*"
          - "org.jetbrains.kotlin*"
      kotlin-dependencies:
        patterns:
          - "org.jetbrains.kotlinx*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
